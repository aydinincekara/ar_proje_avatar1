<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Dijital Sergi</title>
    
    <!-- Google Model-Viewer Kütüphanesi -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #222; 
            overflow: hidden; 
            font-family: sans-serif; 
        }
        
        /* Metin Taşma Sorunu Giderildi: max-width ve font-size optimize edildi */
        #bilgi-kutusu {
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); 
            color: #000;
            padding: 10px 18px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
            text-align: center;
            max-width: 90%;
            white-space: normal;
        }

        /* AR Butonu Hizalaması */
        #ar-button {
            position: absolute; 
            bottom: 85px; 
            left: 50%; 
            transform: translateX(-50%);
            background-color: #007bff; 
            color: white;
            border-radius: 8px; 
            padding: 10px 20px;
            font-weight: bold; 
            font-family: sans-serif; 
            cursor: pointer; 
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        /* Üst Yönlendirme İpucu */
        #ipucu-kutusu {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 12px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            width: 85%;
        }

        /* MOBİL UYUMLU DOKUNMATİK NOKTALAR */
        .Hotspot {
            display: block; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%;
            border: 3px solid #ffffff; 
            background-color: rgba(200, 0, 0, 0.85);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            cursor: pointer; 
            outline: none;
        }

        /* BİLGİ BALONCUĞU */
        .HotspotAnnotation {
            position: absolute; 
            top: -55px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); 
            color: #fff; 
            padding: 10px 14px;
            border-radius: 8px; 
            font-size: 14px; 
            width: max-content; 
            max-width: 220px;
            white-space: normal; 
            pointer-events: none;
            opacity: 0; 
            visibility: hidden; 
            transition: opacity 0.3s ease-in-out;
        }

        .Hotspot:focus .HotspotAnnotation,
        .Hotspot:active .HotspotAnnotation {
            opacity: 1; 
            visibility: visible;
        }
    </style>
</head>
<body>

<div id="ipucu-kutusu">Modeli döndürün, kırmızı noktalara dokunarak inceleyin.</div>

<!-- 3D Sahne -->
<model-viewer 
    id="ar-sahne"
    src="assets/renklikalp.glb" 
    autoplay
    style="width: 100vw; height: 100vh;"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    tone-mapping="neutral" 
    environment-image="neutral" 
    exposure="1.2" 
    shadow-intensity="1">
    
    <button class="Hotspot" slot="hotspot-1" data-position="-0.10571576626445855m 0.40000702011549927m 0.057633221900686316m" data-normal="-0.7285922970594364m -0.31771914021612574m 0.6068012958176506m">
        <div class="HotspotAnnotation">1. Bölüm: Aort Damarı</div>
    </button>
    
    <button class="Hotspot" slot="hotspot-2" data-position="0.164875577295869m 0.19798462246435022m 0.13380936629230766m" data-normal="0.31501005293120066m 0.9080127962915654m 0.2761909273003991m">
        <div class="HotspotAnnotation">2. Bölüm: Sağ Karıncık</div>
    </button>
    
    <button class="Hotspot" slot="hotspot-3" data-position="0.032028800303243954m 0.20084505253255147m -0.21156466090353998m" data-normal="0.6837490947219559m 0.24938585056564644m -0.6857797554642124m">
        <div class="HotspotAnnotation">3. Bölüm: Sol Kulakçık</div>
    </button>
    
    <button class="Hotspot" slot="hotspot-4" data-position="-0.04455793006609626m 0.40367757094254864m -0.04451800243573645m" data-normal="-0.3051802688264568m 0.907471420548707m 0.2887224002503501m">
        <div class="HotspotAnnotation">4. Bölüm: Pulmoner Arter</div>
    </button>
    
    <button slot="ar-button" id="ar-button">
        Odaya Yerleştir (AR)
    </button>
</model-viewer>
    
<div id="bilgi-kutusu">Gerçek boyutta görmek için butona basın.</div>
    <!-- Gizli Ses Oynatıcı -->
<audio id="kalp-sesi" src="assets/kalp-sesi.mp3" loop preload="auto"></audio>

<script>
    // Kullanıcı ekranın neresine dokunursa dokunsun, sesi başlatır ve döngüye sokar
    const kalpSesi = document.getElementById('kalp-sesi');
    
    document.body.addEventListener('click', function baslat() {
        kalpSesi.play().catch(error => {
            console.log("Ses oynatma engellendi, tekrar deneniyor...");
        });
        // Sadece ilk dokunuşta tetiklenmesi için dinleyiciyi kaldırıyoruz
        document.body.removeEventListener('click', baslat);
    });
</script>

</body>
</html>

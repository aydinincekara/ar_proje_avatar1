<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Dijital Sergi</title>
    <!-- Google Model-Viewer Kütüphanesi -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; font-family: sans-serif; }
        
        /* Bilgi ve Yükleme Kutusu */
        #bilgi-kutusu {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); color: #000;
            padding: 12px 24px; border-radius: 30px; 
            font-weight: bold; pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* MOBİL UYUMLU DOKUNMATİK NOKTALAR (44x44px) */
        .Hotspot {
            display: block; width: 44px; height: 44px; border-radius: 50%;
            border: 3px solid #ffffff; background-color: rgba(200, 0, 0, 0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; outline: none;
        }

        /* BİLGİ BALONCUĞU METNİ */
        .HotspotAnnotation {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); color: #fff; padding: 12px 16px;
            border-radius: 8px; font-size: 16px; width: max-content; max-width: 250px;
            white-space: normal; pointer-events: none;
            opacity: 0; visibility: hidden; transition: opacity 0.3s ease-in-out;
        }

        /* Mobilde butona dokunulduğunda metni göster */
        .Hotspot:focus .HotspotAnnotation,
        .Hotspot:active .HotspotAnnotation {
            opacity: 1; visibility: visible;
        }

        /* AR Butonu Hizalama Düzeltmesi */
        #ar-button {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            background-color: white; border-radius: 8px; padding: 10px 20px;
            font-weight: bold; font-family: sans-serif; cursor: pointer; border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<!-- ID: ar-sahne eklendi. JS bu ID'yi arıyor -->
<model-viewer 
    id="ar-sahne"
    src="renklikalp.glb" 
    style="width: 100vw; height: 100vh;"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    tone-mapping="neutral" 
    environment-image="neutral" 
    exposure="1.2" 
    shadow-intensity="1">
    
    <button class="Hotspot" slot="hotspot-1" data-position="-0.10571576626445855m 0.40000702011549927m 0.057633221900686316m" data-normal="-0.7285922970594364m -0.31771914021612574m 0.6068012958176506m" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">1. Bölüm</div>
    </button>
    
    <button class="Hotspot" slot="hotspot-2" data-position="0.164875577295869m 0.19798462246435022m 0.13380936629230766m" data-normal="0.31501005293120066m 0.9080127962915654m 0.2761909273003991m" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">2. Bölüm</div>
    </button>
    
    <button class="Hotspot" slot="hotspot-3" data-position="0.032028800303243954m 0.20084505253255147m -0.21156466090353998m" data-normal="0.6837490947219559m 0.24938585056564644m -0.6857797554642124m" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">3. Bölüm</div>
    </button>
    
    <button class="Hotspot" slot="hotspot-4" data-position="-0.04455793006609626m 0.40367757094254864m -0.04451800243573645m" data-normal="-0.3051802688264568m 0.907471420548707m 0.2887224002503501m" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">4. Bölüm</div>
    </button>
    
    <button slot="ar-button" id="ar-button">
        AR'da Gör
    </button>
</model-viewer>
    
<div id="bilgi-kutusu">360° inceleyin veya AR'da görün!</div>

</body>
</html>
